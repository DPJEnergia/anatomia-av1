<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anatomia AV1">
<meta name="theme-color" content="#fbeff3">
<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Anatomia AV1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de uma coluna, abas no topo, cartão central grande para estudar no celular */
:root{
  --bg:#fbeff3; --surface:#fffafc; --ink:#2e1a24; --muted:#7a5d69; --line:#f0d3de;
  --accent:#b23c73; --accent-soft:#fadbe7; --good:#2c7a39; --good-soft:#e0f0e2; --bad:#b03e2d; --bad-soft:#f6e3df;
  --display:"Young Serif",Georgia,serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1218; --surface:#271a21; --ink:#f5e6ec; --muted:#c09fad; --line:#3e2a34;
  --accent:#f4a6c6; --accent-soft:#4a2737; --good:#74c681; --good-soft:#1c3221; --bad:#ec8572; --bad-soft:#3a221d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1218; --surface:#271a21; --ink:#f5e6ec; --muted:#c09fad; --line:#3e2a34;
  --accent:#f4a6c6; --accent-soft:#4a2737; --good:#74c681; --good-soft:#1c3221; --bad:#ec8572; --bad-soft:#3a221d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,38px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs button{font:inherit;font-weight:600;font-size:13px;border:0;background:transparent;color:var(--muted);padding:10px 2px;min-width:0;border-radius:9px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}
button:focus-visible,.chip:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:14px;cursor:pointer;user-select:none;box-shadow:0 1px 0 var(--line)}
.card .tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.card .front{font-family:var(--display);font-size:clamp(22px,5vw,28px);line-height:1.25;text-wrap:balance}
.card .back{font-size:17px;border-top:1px dashed var(--line);padding-top:14px}
.card .hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:13px 18px;border-radius:12px;cursor:pointer;flex:1;min-width:120px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.q{font-family:var(--display);font-size:clamp(20px,4.6vw,25px);line-height:1.3;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:13px 16px;border-radius:12px;cursor:pointer}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.why{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.score{font-family:var(--display);font-size:56px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
textarea{font:inherit;font-size:15px;width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical}
.gq{display:flex;flex-direction:column;gap:10px;padding-block:16px;border-top:1px solid var(--line)}
.gq:first-of-type{border-top:0;padding-top:0}
.gq .n{font-family:var(--mono);font-size:13px;color:var(--accent)}
.gq p{margin:0}
.model{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:15px}
.model ul{margin:6px 0 0;padding-left:20px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.f{font-family:var(--mono);font-size:13px;white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;font-family:var(--mono);font-size:12px;vertical-align:middle;margin:0 1px}
.frac span:first-child{border-bottom:1px solid currentColor;padding:0 2px}
.small{font-size:13px;color:var(--muted);margin:0}
.miss{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
/* figuras */
.wrap>*,.panel,#tab-figuras>div{min-width:0}
.stagewrap,.figpick{max-width:100%;min-width:0}
.figtools .btn{white-space:nowrap}
.figpick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.figpick .chip{white-space:nowrap;flex:none}
.stagewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.stage{position:relative;min-width:620px;container-type:inline-size}
.stage img{display:block;width:100%;height:auto;max-width:none}
.mk{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));display:flex;align-items:center;justify-content:center;
  font:700 max(9px,1.25cqw)/1 var(--body);border-radius:4px;cursor:pointer;padding:0;border:1.5px solid #8c2f5c;background:#b23c73;color:#fff;
  overflow:hidden;white-space:nowrap}
.mk.fill{background:#fff;color:#8c2f5c;border-color:#b23c73}
.mk.open{background:#e3f2e5;color:#1f5f2a;border-color:#2c7a39;font-weight:600;font-size:max(8px,1.05cqw)}
.mk.cover.open{background:transparent;border-color:#2c7a39;border-style:dashed;color:transparent}
.mk.sel{outline:3px solid #e0a21b;outline-offset:1px}
.ring{position:absolute;transform:translate(-50%,-50%);width:max(22px,3.2cqw);height:max(22px,3.2cqw);border-radius:50%;border:2.5px solid #d08a00;
  background:rgba(224,162,27,.18);cursor:pointer;padding:0}
.ring.open{border-color:#2c7a39;background:rgba(44,122,57,.15)}
.ring.sel{box-shadow:0 0 0 3px #e0a21b}
.cov{position:absolute;transform:translate(-50%,-50%);background:#fbe3ec;border:1px solid #efc3d4;display:flex;align-items:center;justify-content:center;
  font:600 max(10px,1.4cqw)/1.2 var(--body);color:#5a6965}
.figtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.figtools .row{flex:1;min-width:0}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.fi{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.fi.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fi .num{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent);text-align:center}
.fi input{font:inherit;font-size:15px;width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);color:var(--ink)}
.fi .see{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 10px;border-radius:8px;cursor:pointer}
.fi .res{grid-column:2 / 4;font-size:14px}
.fi .res.ok{color:var(--good)} .fi .res.no{color:var(--bad)} .fi .res.na{color:var(--ink)}
.fi .res em{color:var(--muted);font-style:normal;font-size:12px}
.chk{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<div class="wrap">
  <header>
    <span class="eyebrow">Anatomia Descritiva dos Animais Domésticos · Prof. Yohana</span>
    <h1>Revisão para a AV1</h1>
    <p class="sub">Aulas 1 a 3 e Guia do esqueleto axial, na ordem dos guias, com as figuras dos PDFs para treinar a prova prática.</p>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="cards" aria-selected="true">Cartões</button>

    <button role="tab" data-tab="guia" aria-selected="false">Guia 3</button>

  <div class="chips" id="topics"></div>

  <section id="tab-cards"></section>
  <section id="tab-quiz" hidden></section>
  <section id="tab-figuras" hidden></section>

</div>

["termos","Posição anatômica veterinária","Animal em estação, apoiado nos quatro membros, com a cabeça erguida e voltada para a frente."],
["termos","Divisão anatômica geral","Corpo dividido em cabeça, pescoço, tronco (tórax, abdome e pelve), cauda e membros (torácicos e pélvicos). A Anatomia, por sua vez, se divide em sistêmica e regional."],
["termos","Normalidade anatômica","O padrão mais frequente na população. É um conceito estatístico."],
["termos","Variação anatômica","Diferença de forma em relação ao padrão normal, sem prejuízo da função."],
["termos","Anomalia congênita","Desvio do normal que causa prejuízo funcional e já está presente ao nascimento."],
["termos","Malformação","Anomalia grave do desenvolvimento, que altera muito a forma e pode ser incompatível com a vida."],
["termos","Planos anatômicos: para que servem?","Superfícies imaginárias de referência. Servem para descrever a posição e a direção das estruturas e para padronizar cortes do corpo."],
["termos","Plano mediano","Divide o corpo em metades direita e esquerda iguais (antímeros). Existe só um."],
["termos","Planos sagitais","Paralelos ao plano mediano. Dividem o corpo em partes direita e esquerda desiguais."],
["termos","Plano dorsal","Paralelo ao dorso. Divide o corpo em parte dorsal e parte ventral. Na figura do equino do Guia 1 aparece como “plano horizontal”."],
["termos","Plano transversal","Perpendicular ao eixo longo do corpo ou do membro. Divide em parte cranial e caudal (no membro, proximal e distal)."],
["termos","Plano × eixo","Plano é uma superfície de corte imaginária. Eixo é uma linha. Eixos: longitudinal (craniocaudal), transversal (laterolateral) e dorsoventral."],
["termos","Ipsilateral × contralateral","Ipsilateral: do mesmo lado do corpo. Contralateral: do lado oposto."],
["termos","Cranial","Em direção à cabeça. Usado no tronco, pescoço e membros acima do carpo e do tarso."],
["termos","Caudal","Em direção à cauda."],
["termos","Rostral","Em direção ao focinho. Usado só na cabeça."],
["termos","Dorsal","Em direção ao dorso. Nos membros, abaixo do carpo e do tarso, é a face da frente."],
["termos","Ventral","Em direção ao ventre (abdome)."],
["termos","Medial","Mais perto do plano mediano."],
["termos","Lateral","Mais longe do plano mediano."],
["termos","Proximal","Nos membros: mais perto do tronco."],
["termos","Distal","Nos membros: mais longe do tronco."],
["termos","Palmar e plantar","Face de trás do membro abaixo do carpo (palmar, membro torácico) ou do tarso (plantar, membro pélvico)."],

["osteo","Por que estudar Osteologia?","É a base de toda a Anatomia Veterinária. Os ossos explicam a organização do corpo, os locais de inserção muscular, a formação das articulações e a descrição das regiões do organismo."],
["osteo","Osso: tecido ou órgão?","Órgão. Reúne tecido ósseo, medula, periósteo, cartilagem, vasos e nervos. O tecido ósseo é só um dos componentes."],
["osteo","Funções dos ossos","Sustentação, proteção (crânio, tórax), locomoção (alavanca e inserção de músculos), reserva de cálcio e fósforo, hematopoese (medula vermelha) e reserva de gordura (medula amarela)."],
["osteo","Sistema esquelético","Conjunto de ossos, cartilagens e articulações que forma o arcabouço do corpo. Divide-se em esqueleto axial, apendicular e visceral."],
["osteo","Esqueleto axial","Crânio (com mandíbula e hioide), coluna vertebral, costelas e esterno."],
["osteo","Esqueleto apendicular","Ossos dos membros torácicos e pélvicos, incluindo as cinturas."],
["osteo","Cintura escapular","Nos domésticos fica reduzida à escápula. Clavícula ausente ou vestigial (cão, gato). Liga-se ao tronco só por músculos (sinsarcose)."],
["osteo","Cintura pélvica","Ossos do quadril (coxal): ílio, ísquio e púbis, fundidos no acetábulo. Articula com o sacro, uma ligação óssea firme."],
["osteo","Osso longo","Comprimento maior que a largura. Tem diáfise, epífises e cavidade medular. Ex.: fêmur, úmero."],
["osteo","Osso curto","Dimensões parecidas nos três sentidos. Ex.: ossos do carpo e do tarso."],
["osteo","Osso plano","Fino e laminar; proteção e área de inserção muscular. Ex.: escápula, ossos da calota craniana."],
["osteo","Osso irregular","Forma complexa que não se encaixa nas outras classes. Ex.: vértebras."],
["osteo","Osso sesamoide","Forma-se dentro de um tendão, perto de uma articulação; reduz atrito. Ex.: patela, sesamoides proximais."],
["osteo","Osso pneumático","Tem cavidades com ar revestidas de mucosa. Ex.: frontal e maxila (seios paranasais)."],
["osteo","Osso visceral (esplâncnico)","Forma-se dentro de vísceras, sem ligação com o esqueleto. Ex.: osso do pênis (cão), osso do coração (bovino)."],
["osteo","Epífise","Extremidade do osso longo, geralmente articular."],
["osteo","Diáfise","Corpo (haste) do osso longo, onde fica a cavidade medular."],
["osteo","Metáfise","Região entre diáfise e epífise. No animal jovem contém a cartilagem de crescimento (fise), que faz o osso crescer em comprimento."],
["osteo","Cavidade medular","Canal dentro da diáfise que guarda a medula óssea."],
["osteo","Periósteo","Membrana conjuntiva que reveste o osso por fora, exceto nas superfícies articulares. Vascularizada e sensível; forma osso (crescimento em espessura e reparo de fraturas)."],
["osteo","Endósteo","Membrana fina que reveste a cavidade medular por dentro."],
["osteo","Osso compacto","Denso e maciço. Forma a cortical, mais espessa na diáfise."],
["osteo","Osso esponjoso","Trabéculas com espaços cheios de medula vermelha. Predomina nas epífises."],
["osteo","Cartilagem","Nos ossos longos: cartilagem articular (hialina), que cobre as superfícies articulares e reduz o atrito; no jovem, também a cartilagem de crescimento na metáfise."],
["osteo","Forame nutrício","Orifício por onde a artéria nutrícia entra no osso."],
["osteo","Tuberosidade","Elevação grande e rugosa para inserção muscular. Ex.: tuberosidade da tíbia."],
["osteo","Tubérculo","Elevação pequena e arredondada. Ex.: tubérculo da costela."],
["osteo","Crista","Elevação estreita e alongada. Ex.: crista da tíbia."],
["osteo","Espinha","Projeção afilada ou em lâmina. Ex.: espinha da escápula."],
["osteo","Cabeça (acidente ósseo)","Extremidade arredondada e articular. Ex.: cabeça do fêmur."],
["osteo","Colo","Estreitamento logo abaixo da cabeça. Ex.: colo do fêmur."],
["osteo","Côndilo","Saliência articular arredondada. Ex.: côndilos do fêmur, côndilos occipitais."],
["osteo","Epicôndilo","Saliência não articular junto ao côndilo; inserção de músculos e ligamentos. Ex.: epicôndilos do úmero."],
["osteo","Tróclea","Superfície articular em forma de polia. Ex.: tróclea do fêmur."],
["osteo","Forame","Orifício que atravessa o osso. Ex.: forame magno."],
["osteo","Fossa","Depressão ou escavação no osso. Ex.: fossa do olécrano."],
["osteo","Tipos de ossificação","Intramembranosa: direto no tecido conjuntivo (ossos planos do crânio). Endocondral: sobre um molde de cartilagem (ossos longos)."],
["osteo","Crescimento ósseo","Em comprimento: cartilagem de crescimento (fise). Em espessura: aposição de osso pelo periósteo."],

["coluna","Quais estruturas compõem o esqueleto axial?","Crânio (com mandíbula e hioide), coluna vertebral, costelas e esterno."],
["coluna","Partes da vértebra típica","Corpo, arco vertebral, forame vertebral, processo espinhoso, processos transversos e processos articulares."],
["coluna","Corpo vertebral","Parte ventral, cilíndrica; sustenta peso. Liga-se às vértebras vizinhas pelos discos intervertebrais."],
["coluna","Arco vertebral","Junto com o corpo, delimita o forame vertebral e protege a medula espinal."],
["coluna","Forame vertebral","Orifício de cada vértebra. Somados, formam o canal vertebral, que aloja a medula espinal."],
["coluna","Processo espinhoso","Projeção dorsal do arco; inserção de músculos e ligamentos."],
["coluna","Processos transversos","Projeções laterais; inserção muscular e alavanca para os movimentos."],
["coluna","Processos articulares","Craniais e caudais; articulam uma vértebra com a seguinte."],
["coluna","Forame intervertebral","Espaço entre duas vértebras vizinhas por onde saem os nervos espinhais."],
["coluna","Regiões da coluna","Cervical, torácica, lombar, sacral e caudal."],
["coluna","Quantas vértebras cervicais?","7 em todos os mamíferos domésticos."],
["coluna","Como reconhecer uma cervical","Corpo longo, processos transversos largos, forame transversal (C1 a C6) e processo espinhoso baixo (exceto no áxis)."],
["coluna","Como reconhecer uma torácica","Processo espinhoso alto (forma a cernelha), corpo curto e fóveas costais para as costelas."],
["coluna","Como reconhecer uma lombar","Processos transversos longos, achatados e horizontais; corpos uniformes; sem fóveas costais."],
["coluna","Sacro","Vértebras sacrais fundidas; articula com o ílio (articulação sacroilíaca). Cão 3, suíno 4, bovino e equino 5."],
["coluna","Vértebras caudais","Vão ficando mais simples em direção à ponta da cauda; as últimas são só o corpo."],
["coluna","Comparando: processo espinhoso","Cervical: baixo (alto só no áxis). Torácica: alto, forma a cernelha. Lombar: médio e largo."],
["coluna","Comparando: processo transverso","Cervical: largo, com forame transversal. Torácica: curto, com fóvea para o tubérculo da costela. Lombar: longo, achatado e horizontal."],
["coluna","Exercício 1: de que região é esta vértebra?","Forame transversal → cervical. Espinhoso alto e fóveas costais → torácica. Transversos longos e achatados → lombar. Vértebras fundidas → sacro. Pequena, quase só corpo → caudal."],
["coluna","Atlas (C1)","Sem corpo e sem processo espinhoso; asas largas; arcos dorsal e ventral. Articula com os côndilos occipitais: movimento de “sim”."],
["coluna","Áxis (C2)","Longo, com processo espinhoso alto em forma de crista. Tem o dente (processo odontoide), que se encaixa no atlas: rotação, movimento de “não”."],

["coluna","Partes da costela","Cabeça, colo, tubérculo e corpo (com o ângulo). Costela óssea + cartilagem costal."],
["coluna","Cabeça da costela","Articula com as fóveas costais de duas vértebras torácicas vizinhas."],
["coluna","Tubérculo da costela","Articula com o processo transverso da vértebra torácica."],
["coluna","Costelas esternais (verdadeiras)","A cartilagem costal articula direto com o esterno. Cão 9 pares; bovino e equino 8."],

["coluna","Esternébras","Segmentos ósseos do corpo do esterno, unidos por cartilagem."],

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(store.get("av1-known",[]));
let active=new Set(store.get("av1-topics",Object.keys(TOPICS)));
if(!active.size) active=new Set(Object.keys(TOPICS));
let tab="cards";

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function renderTopics(){
  const el=$("#topics");
  el.hidden=(tab==="guia"||tab==="resumo"||tab==="figuras");
  el.innerHTML=Object.entries(TOPICS).map(([k,v])=>{
    const tot=CARDS.filter(c=>c[0]===k).length, ok=CARDS.filter(c=>c[0]===k&&known.has(c[1])).length;
    return `<button class="chip" data-t="${k}" aria-pressed="${active.has(k)}">${v} · ${ok}/${tot}</button>`}).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const k=b.dataset.t;
    if(active.has(k)&&active.size>1) active.delete(k); else active.add(k);
    store.set("av1-topics",[...active]); renderTopics(); startCards(); startQuiz();
  });
}

/* ---------- cartões ---------- */
let deck=[],pos=0,flipped=false,missed=[],sessionTotal=0;
function startCards(onlyMissed){
  const pool=onlyMissed?missed.slice():CARDS.filter(c=>active.has(c[0]));
  deck=shuffle(pool); sessionTotal=deck.length; pos=0; flipped=false; missed=[]; drawCard();
}
function drawCard(){
  const el=$("#tab-cards");
  const done=sessionTotal-deck.length;
  if(!deck.length){
    el.innerHTML=`<div class="panel"><h2>Rodada concluída</h2>
      <p class="sub">${missed.length?`Você errou ${missed.length} cartão(ões) nesta rodada. Repita só esses até acertar todos.`:"Acertou tudo nesta rodada."}</p>
      <div class="row">${missed.length?`<button class="btn primary" id="again-miss">Repetir os errados</button>`:""}<button class="btn" id="again-all">Nova rodada completa</button></div></div>`;
    $("#again-all").onclick=()=>startCards(false);
    if(missed.length) $("#again-miss").onclick=()=>startCards(true);
    return;
  }
  const c=deck[0];
  el.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
    <div class="meta"><span>${done} de ${sessionTotal} na rodada</span><span>${known.size} de ${CARDS.length} dominados</span></div>
    <div class="bar"><i style="width:${sessionTotal?done/sessionTotal*100:0}%"></i></div>
    <div class="card" id="card" tabindex="0" role="button" aria-label="Virar cartão">
      <span class="tag">${TOPICS[c[0]]}</span>
      <div class="front">${esc(c[1])}</div>
      ${flipped?`<div class="back">${esc(c[2])}</div>`:`<div class="hint">Responda de cabeça, depois toque para ver.</div>`}
    </div>
    <div class="row">
      ${flipped?`<button class="btn bad" id="miss">Errei</button><button class="btn good" id="hit">Acertei</button>`:`<button class="btn primary" id="flip">Ver resposta</button>`}
    </div>
    <p class="small">Teclado: espaço vira, 1 = errei, 2 = acertei.</p></div>`;
  const flip=()=>{if(!flipped){flipped=true;drawCard()}};
  $("#card").onclick=flip;
  if(!flipped) $("#flip").onclick=flip;
  else{ $("#miss").onclick=()=>answer(false); $("#hit").onclick=()=>answer(true); }
}
function answer(ok){
  const c=deck.shift();
  if(ok){known.add(c[1])}else{known.delete(c[1]);if(!missed.includes(c))missed.push(c);deck.splice(Math.min(3,deck.length),0,c);sessionTotal++}
  store.set("av1-known",[...known]); flipped=false; drawCard(); renderTopics();
}

/* ---------- quiz ---------- */
let qs=[],qi=0,score=0,chosen=null,wrongs=[],lastWrongs=[];
let qsize=store.get("av1-qsize",15);
function startQuiz(onlyWrong){
  const pool=onlyWrong&&lastWrongs.length?lastWrongs.map(w=>QUIZ.find(q=>q[1]===w.q)):QUIZ.filter(q=>active.has(q[0]));
  const n=onlyWrong||qsize===0?pool.length:qsize;
  qs=shuffle(pool).slice(0,n).map(q=>({t:q[0],q:q[1],ans:q[2][0],opts:shuffle(q[2]),why:q[3]}));
  qi=0;score=0;chosen=null;wrongs=[];drawQuiz();
}
function sizePicker(){
  const total=QUIZ.filter(q=>active.has(q[0])).length;
  return `<div class="chips" aria-label="Tamanho do quiz">${[[15,"15 questões"],[30,"30 questões"],[0,`Todas (${total})`]].map(([v,l])=>`<button class="chip qsz" data-n="${v}" aria-pressed="${qsize===v}">${l}</button>`).join("")}</div>`;
}
function bindSize(el){
  el.querySelectorAll(".qsz").forEach(b=>b.onclick=()=>{qsize=+b.dataset.n;store.set("av1-qsize",qsize);startQuiz()});
}
function drawQuiz(){
  const el=$("#tab-quiz");
  if(qi>=qs.length){
    const pct=Math.round(score/qs.length*100);
    el.innerHTML=`<div class="panel"><span class="eyebrow">Resultado</span><div class="score">${score}/${qs.length}</div>
      <p class="sub">${pct>=80?"Bom nível para a prova. Revise os erros abaixo.":pct>=60?"Quase lá. Volte aos cartões dos temas que errou.":"Faça mais uma rodada de cartões antes de repetir o quiz."}</p>
      ${wrongs.length?`<h2>Para revisar</h2><ul class="miss">${wrongs.map(w=>`<li><strong>${esc(w.q)}</strong><br>${esc(w.ans)}</li>`).join("")}</ul>`:""}
      <div class="row">${wrongs.length?`<button class="btn" id="qwrong">Refazer só as erradas</button>`:""}<button class="btn primary" id="qagain">Novo quiz</button></div>${sizePicker()}</div>`;
    lastWrongs=wrongs.slice();
    $("#qagain").onclick=()=>startQuiz(false);
    if(wrongs.length) $("#qwrong").onclick=()=>startQuiz(true);
    bindSize(el); return;
  }
  const q=qs[qi];
  el.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    ${qi===0&&chosen===null?sizePicker():""}
    <div class="meta"><span>Questão ${qi+1} de ${qs.length}</span><span>${score} acerto(s)</span></div>
    <div class="bar"><i style="width:${qi/qs.length*100}%"></i></div>
    <div class="panel"><span class="eyebrow">${TOPICS[q.t]}</span><p class="q">${esc(q.q)}</p>
    <div class="opts">${q.opts.map((o,i)=>{
      let cls="opt"; if(chosen!==null){ if(o===q.ans) cls+=" right"; else if(o===chosen) cls+=" wrong"; }
      return `<button class="${cls}" data-i="${i}" ${chosen!==null?"disabled":""}>${esc(o)}</button>`}).join("")}</div>
    ${chosen!==null?`<div class="why">${chosen===q.ans?"Certo. ":"Resposta: "+esc(q.ans)+". "}${esc(q.why)}</div>`:""}
    </div>
    ${chosen!==null?`<div class="row"><button class="btn primary" id="qnext">${qi+1<qs.length?"Próxima":"Ver resultado"}</button></div>`:""}</div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    chosen=q.opts[+b.dataset.i];
    if(chosen===q.ans) score++; else wrongs.push(q);
    drawQuiz();
  });
  if(chosen!==null) $("#qnext").onclick=()=>{qi++;chosen=null;drawQuiz()};
  bindSize(el);
}

const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const strip=s=>s.replace(/^(o |a |os |as )/,"").replace(/^(osso |ossos )/,"").replace(/s$/,"");
function accepted(it){
  const base=[it.ans,it.ans.replace(/\s*\(.*\)\s*/g," ")].concat(it.alt||[]);
  return new Set(base.map(x=>strip(norm(x))).filter(Boolean));
}
const shortAns=a=>a.replace(/\s*\(.*\)\s*/g,"").trim();
let figIdx=FIGS.findIndex(f=>f.id==="esqueleto"); const figState={};
function fstate(f){return figState[f.id]||(figState[f.id]={open:new Set(),typed:{}})}
function drawFiguras(){
  const f=FIGS[figIdx], st=fstate(f);
  const allOpen=st.open.size===f.items.length;
  const opts=[...new Set(f.items.map(i=>shortAns(i.ans)))].sort((a,b)=>a.localeCompare(b,"pt"));
  let marks="";
  f.items.forEach((it,i)=>{
    const op=st.open.has(i);
    if(it.box){const [x,y,w,h,r]=it.box;
      marks+=`<button class="mk ${it.fill?"fill":"cover"} ${op?"open":""}" data-i="${i}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;--r:${r}deg" aria-label="Estrutura ${it.n}">${op&&it.fill?esc(shortAns(it.ans)):it.n}</button>`;}
    (it.pts||[]).forEach(p=>{marks+=`<button class="ring ${op?"open":""}" data-i="${i}" style="left:${p[0]}%;top:${p[1]}%" aria-label="Estrutura ${it.n}"></button>`});
  });
  if(!allOpen) f.covers.forEach(c=>{marks+=`<div class="cov" style="left:${c[0]}%;top:${c[1]}%;width:${c[2]}%;height:${c[3]}%">Legenda escondida</div>`});
  $("#tab-figuras").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="figpick">${FIGS.map((g,k)=>`<button class="chip" data-f="${k}" aria-pressed="${k===figIdx}">${esc(g.title)}</button>`).join("")}</div>
    <div class="panel">
      <span class="eyebrow">${esc(f.src_label)}</span>
      <h2>${esc(f.title)}</h2>
      <p class="small">${esc(f.note)}</p>
      <div class="figtools"><span class="small" id="fcount">${st.open.size} de ${f.items.length} revelados</span>
        <div class="row" style="flex:none"><button class="btn" id="fhide" style="min-width:0;padding:9px 14px">Esconder tudo</button><button class="btn primary" id="fshow" style="min-width:0;padding:9px 14px">Revelar tudo</button></div></div>
      <div class="stagewrap"><div class="stage"><img src="${f.src}" alt="${esc(f.title)}">${marks}</div></div>
      <p class="small">Toque num número da figura para revelar só aquele. Ou escreva a resposta na lista e toque em Ver para conferir.</p>
      <datalist id="dl-${f.id}">${opts.map(o=>`<option value="${esc(o)}"></option>`).join("")}</datalist>
      <div class="flist">${f.items.map((it,i)=>`<div class="fi" id="fi${i}"><span class="num">${it.n}</span>
        <input id="fin-${f.id}-${i}" list="dl-${f.id}" placeholder="Nome da estrutura" autocomplete="off" value="${esc(st.typed[i]||"")}">
        <button class="see" data-i="${i}">${st.open.has(i)?"Ocultar":"Ver"}</button>
        <div class="res" id="fr${i}" ${st.open.has(i)?"":"hidden"}></div></div>`).join("")}</div>
    </div></div>`;
  f.items.forEach((it,i)=>{if(st.open.has(i)) paintRes(f,i)});
  document.querySelectorAll("#tab-figuras [data-f]").forEach(b=>b.onclick=()=>{figIdx=+b.dataset.f;drawFiguras()});
  document.querySelectorAll("#tab-figuras .mk, #tab-figuras .ring").forEach(b=>b.onclick=()=>toggleItem(+b.dataset.i));
  document.querySelectorAll("#tab-figuras .see").forEach(b=>b.onclick=()=>toggleItem(+b.dataset.i));
  document.querySelectorAll("#tab-figuras .fi input").forEach((inp,i)=>{
    inp.oninput=()=>{st.typed[i]=inp.value; if(st.open.has(i)) paintRes(f,i)};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault(); if(!st.open.has(i)) toggleItem(i)}};
    inp.onfocus=()=>selectItem(i,true); inp.onblur=()=>selectItem(i,false);
  });
  $("#fshow").onclick=()=>{f.items.forEach((_,i)=>st.open.add(i));drawFiguras()};
  $("#fhide").onclick=()=>{st.open.clear();drawFiguras()};
}
function selectItem(i,on){
  document.querySelectorAll(`#tab-figuras [data-i="${i}"]:not(.see)`).forEach(m=>m.classList.toggle("sel",on));
  const row=$("#fi"+i); if(row) row.classList.toggle("sel",on);
}
function paintRes(f,i){
  const it=f.items[i], st=fstate(f), el=$("#fr"+i); if(!el) return;
  const typed=(st.typed[i]||"").trim();
  const note=it.unsure?` <em>(seta imprecisa na figura; confirme com a professora)</em>`:"";
  if(!typed){el.className="res na";el.innerHTML=`${esc(it.ans)}${note}`;return}
  const ok=accepted(it).has(strip(norm(typed)));
  el.className="res "+(ok?"ok":"no");
  el.innerHTML=(ok?"Certo: ":"Resposta: ")+esc(it.ans)+note;
}
function toggleItem(i){
  const f=FIGS[figIdx], st=fstate(f);
  const wasAll=st.open.size===f.items.length;
  if(st.open.has(i)) st.open.delete(i); else st.open.add(i);
  const isAll=st.open.size===f.items.length;
  if(wasAll!==isAll||f.covers.length&&isAll){drawFiguras();return}
  const op=st.open.has(i), it=f.items[i];
  document.querySelectorAll(`#tab-figuras .mk[data-i="${i}"], #tab-figuras .ring[data-i="${i}"]`).forEach(m=>{
    m.classList.toggle("open",op);
    if(m.classList.contains("mk")) m.textContent=op&&it.fill?shortAns(it.ans):it.n;
  });
  const btn=document.querySelector(`#tab-figuras .see[data-i="${i}"]`); if(btn) btn.textContent=op?"Ocultar":"Ver";
  const r=$("#fr"+i); r.hidden=!op; if(op) paintRes(f,i);
  $("#fcount").textContent=`${st.open.size} de ${f.items.length} revelados`;
}

/* ---------- guia 3 ---------- */
function drawGuia(){
  const drafts=store.get("av1-drafts",{});
  $("#tab-guia").innerHTML=`<div class="panel">
    <h2>Questões do Guia 3</h2>
    <p class="small">Escreva sua resposta primeiro, sem olhar. Depois abra a resposta de conferência e corrija o que faltou.</p>
    ${GUIA.map((g,i)=>`<div class="gq"><span class="n">Questão ${i+1}</span><p><strong>${esc(g[0].replace(/^\d+\.\s*/,""))}</strong></p>
      <textarea id="g${i}" placeholder="Sua resposta">${esc(drafts[i]||"")}</textarea>
      <div class="row"><button class="btn" data-g="${i}">Ver resposta de conferência</button></div>
      <div class="model" id="m${i}" hidden><ul>${g[1].map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div></div>`).join("")}
    <p class="small">Confira os detalhes no König & Liebich e no Dyce, como pede a bibliografia do curso.</p></div>`;
  document.querySelectorAll("#tab-guia textarea").forEach((t,i)=>t.oninput=()=>{const d=store.get("av1-drafts",{});d[i]=t.value;store.set("av1-drafts",d)});
  document.querySelectorAll("#tab-guia [data-g]").forEach(b=>b.onclick=()=>{const m=$("#m"+b.dataset.g);m.hidden=!m.hidden;b.textContent=m.hidden?"Ver resposta de conferência":"Esconder resposta"});
}

/* ---------- resumo ---------- */
const fr=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const CHECKS=[
 ["Checklist de aprendizagem · Aula 1",["Explicar o que é Anatomia.","Diferenciar Anatomia e Morfologia.","Diferenciar Anatomia Sistêmica e Regional.","Identificar o plano mediano.","Explicar a função dos planos anatômicos.","Diferenciar planos e eixos.","Utilizar corretamente os termos cranial, caudal, dorsal, ventral, medial, lateral, proximal e distal.","Compreender uma descrição anatômica simples."]],
 ["Objetivos · Aula 3",["Reconhecer as regiões da coluna vertebral.","Identificar uma vértebra típica.","Diferenciar as principais regiões da coluna.","Identificar costelas e esterno."]]
];
function drawResumo(){
  const done=store.get("av1-check",{});
  $("#tab-resumo").innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
  ${CHECKS.map((c,ci)=>`<div class="panel"><h2>${esc(c[0])}</h2><p class="small">${ci===0?"Antes da prova, verifique se você consegue:":"Ao final da aula você deverá ser capaz de:"}</p>
    <ul class="chk">${c[1].map((t,ti)=>`<li><label><input type="checkbox" id="ck-${ci}-${ti}" ${done[ci+"-"+ti]?"checked":""}><span>${esc(t)}</span></label></li>`).join("")}</ul></div>`).join("")}
  <div class="panel"><h2>Regiões da coluna: fórmula vertebral</h2><div class="tablewrap"><table>
    <tr><th>Espécie</th><th>C</th><th>T</th><th>L</th><th>S</th><th>Cd</th></tr>
    <tr><td>Cão</td><td>7</td><td>13</td><td>7</td><td>3</td><td>20–23</td></tr>
    <tr><td>Gato</td><td>7</td><td>13</td><td>7</td><td>3</td><td>18–24</td></tr>
    <tr><td>Bovino</td><td>7</td><td>13</td><td>6</td><td>5</td><td>18–20</td></tr>
    <tr><td>Equino</td><td>7</td><td>18</td><td>6</td><td>5</td><td>15–21</td></tr>
    <tr><td>Suíno</td><td>7</td><td>14–15</td><td>6–7</td><td>4</td><td>20–23</td></tr>
  </table></div><p class="small">Pares de costelas = número de torácicas.</p></div>

  <div class="panel"><h2>Comparando as vértebras</h2><div class="tablewrap"><table>
    <tr><th>Região</th><th>Processo espinhoso</th><th>Processo transverso</th><th>Marca</th></tr>
    <tr><td>Cervical</td><td>Baixo (alto só no áxis)</td><td>Largo</td><td>Forame transversal, corpo longo</td></tr>
    <tr><td>Torácica</td><td>Alto (cernelha)</td><td>Curto</td><td>Fóveas costais</td></tr>
    <tr><td>Lombar</td><td>Médio</td><td>Longo, achatado, horizontal</td><td>Sem fóveas costais</td></tr>
    <tr><td>Sacral</td><td colspan="2">Fundidas em um só osso</td><td>Articula com o ílio</td></tr>
    <tr><td>Caudal</td><td colspan="2">Vão sumindo</td><td>As últimas são só corpo</td></tr>
  </table></div></div>

  <div class="panel"><h2>Fórmula dentária permanente</h2><div class="tablewrap"><table>
    <tr><th>Espécie</th><th>I</th><th>C</th><th>P</th><th>M</th><th>Total</th></tr>
    <tr><td>Cão</td><td>${fr(3,3)}</td><td>${fr(1,1)}</td><td>${fr(4,4)}</td><td>${fr(2,3)}</td><td>42</td></tr>
    <tr><td>Gato</td><td>${fr(3,3)}</td><td>${fr(1,1)}</td><td>${fr(3,2)}</td><td>${fr(1,1)}</td><td>30</td></tr>
    <tr><td>Bovino</td><td>${fr(0,3)}</td><td>${fr(0,1)}</td><td>${fr(3,3)}</td><td>${fr(3,3)}</td><td>32</td></tr>
    <tr><td>Equino ♂</td><td>${fr(3,3)}</td><td>${fr(1,1)}</td><td>${fr("3–4",3)}</td><td>${fr(3,3)}</td><td>40–42</td></tr>
  </table></div><p class="small">Valores de um lado (superior/inferior); o total multiplica por 2. Égua: 36–40, caninos geralmente ausentes.</p></div>

  <div class="panel"><h2>Classificação dos ossos</h2><div class="tablewrap"><table>
    <tr><th>Tipo</th><th>Exemplo</th></tr>
    <tr><td>Longo</td><td>Fêmur, úmero</td></tr><tr><td>Curto</td><td>Carpo, tarso</td></tr>
    <tr><td>Plano</td><td>Escápula, calota craniana</td></tr><tr><td>Irregular</td><td>Vértebras</td></tr>
    <tr><td>Sesamoide</td><td>Patela</td></tr><tr><td>Pneumático</td><td>Frontal, maxila</td></tr>
    <tr><td>Visceral</td><td>Osso do pênis (cão), osso do coração (bovino)</td></tr>
  </table></div></div>

  <div class="panel"><h2>Termos de posição</h2><div class="tablewrap"><table>
    <tr><th>Par</th><th>Referência</th></tr>
    <tr><td class="f">cranial / caudal</td><td>Cabeça / cauda (tronco e membros acima do carpo e tarso)</td></tr>
    <tr><td class="f">rostral</td><td>Focinho (só na cabeça)</td></tr>
    <tr><td class="f">dorsal / ventral</td><td>Dorso / ventre</td></tr>
    <tr><td class="f">medial / lateral</td><td>Perto / longe do plano mediano</td></tr>
    <tr><td class="f">proximal / distal</td><td>Perto / longe do tronco (membros)</td></tr>
    <tr><td class="f">palmar / plantar</td><td>Face de trás abaixo do carpo / tarso</td></tr>
  </table></div></div></div>`;
  document.querySelectorAll("#tab-resumo .chk input").forEach(cb=>cb.onchange=()=>{
    const d=store.get("av1-check",{}); d[cb.id.slice(3)]=cb.checked; store.set("av1-check",d);
  });
}

/* ---------- abas ---------- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["cards","quiz","figuras","guia","resumo"].forEach(t=>$("#tab-"+t).hidden=t!==tab);
  renderTopics();
});
document.addEventListener("keydown",e=>{
  if(tab!=="cards"||e.target.tagName==="TEXTAREA"||!deck.length) return;
  if(e.code==="Space"){e.preventDefault(); if(!flipped){flipped=true;drawCard()}}
  else if(flipped&&e.key==="1") answer(false);
  else if(flipped&&e.key==="2") answer(true);
});

renderTopics(); startCards(); startQuiz(); drawFiguras(); drawGuia(); drawResumo();
</script>
